services:
  app:
    build: .
    image: sofre-digital-python-test
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgres://sofre:sofre@db:5432/sofre_python_test
      APP_ENV: ${APP_ENV:-docker}
      GIT_COMMIT: ${GIT_COMMIT:-}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sofre
      POSTGRES_PASSWORD: sofre
      POSTGRES_DB: sofre_python_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofre -d sofre_python_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
